services:
  redis:
    image: redis:7-alpine
    container_name: ledgerguard-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-LedgerGuard_StrongRedis#2026}"]
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-LedgerGuard_StrongRedis#2026}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
