# Server Configuration
server.port=8080
server.address=0.0.0.0

# 1. MySQL Database Connection (Master DB for Multi-Tenancy)
spring.datasource.url=jdbc:mysql://localhost:3306/master_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Rahul@2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 3. Flyway Migration Settings (Master DB)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/master

# 4. Redis Configuration
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=
spring.data.redis.timeout=2s
spring.data.redis.connect-timeout=2s

# 5. Rate Limiting Configuration
ratelimit.login.capacity=5
ratelimit.login.refill-tokens=5
ratelimit.login.refill-minutes=1

ratelimit.api.capacity=100
ratelimit.api.refill-tokens=100
ratelimit.api.refill-minutes=1

# 6. Security Proxy Trust Flag
security.trust-proxy-headers=false