# Rate Limiting Configuration (Day 4)
ratelimit.login.capacity=5
ratelimit.login.refill-tokens=5
ratelimit.login.refill-minutes=1

ratelimit.api.capacity=100
ratelimit.api.refill-tokens=100
ratelimit.api.refill-minutes=1

# Proxy trust flag (Keep false unless behind a trusted reverse proxy like Nginx/AWS ALB)
security.trust-proxy-headers=false
