# Rate Limits (relaxed for demo and load runs)
ledgerguard.rate-limit.login.per-minute=1000
ledgerguard.rate-limit.default.per-minute=5000
ratelimit.login.capacity=1000
ratelimit.login.refill-tokens=1000
ratelimit.api.capacity=5000
ratelimit.api.refill-tokens=5000

# Reaper Timing (Demo)
ledger.reaper.interval=PT10S
ledger.reaper.stuck-after=PT45S

# Demo Failure Injector Arm File
ledger.demo.failure-file=./.demo/failure

# Demo Logging
logging.level.com.ledgerguard=INFO

# Actuator Health for crash-test.sh readiness checks
management.endpoint.health.show-details=always
management.endpoints.web.exposure.include=health,info