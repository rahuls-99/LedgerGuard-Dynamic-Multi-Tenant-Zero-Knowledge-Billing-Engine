$kind: http-request
name: "6. Security - Header Spoofing Attack (X-Org-Id: orgB - 403 Forbidden)"
url: "{{base_url}}/api/invoices"
method: GET
headers:
  Authorization: Bearer {{jwt_token}}
  X-Org-Id: orgB
scripts:
  - type: afterResponse
    code: pm.test('Header spoofing blocked with 403', function () { pm.response.to.have.status(403); });
    language: text/javascript
order: 6000
