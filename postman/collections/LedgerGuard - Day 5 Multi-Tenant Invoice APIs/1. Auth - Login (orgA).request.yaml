$kind: http-request
url: "{{base_url}}/api/real-auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "orgId": "orgA",
      "email": "admin@orga.com",
      "password": "123456"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      var jsonData = pm.response.json();
      pm.collectionVariables.set('jwt_token', jsonData.token);
      pm.test('JWT Token received', function () { pm.expect(jsonData.token).to.be.a('string').and.not.empty; });
    language: text/javascript
order: 1000
