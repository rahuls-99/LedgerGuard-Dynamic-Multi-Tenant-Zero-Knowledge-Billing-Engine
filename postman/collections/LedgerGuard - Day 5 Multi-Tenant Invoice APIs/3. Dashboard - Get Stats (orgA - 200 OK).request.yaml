$kind: http-request
url: "{{base_url}}/api/invoices/stats"
method: GET
headers:
  Authorization: Bearer {{jwt_token}}
  X-Org-Id: orgA
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () { pm.response.to.have.status(200); });
      var stats = pm.response.json();
      pm.test('Stats match orgA data', function () {
          pm.expect(stats.orgId).to.eql('orgA');
          pm.expect(stats.totalRevenue).to.eql(15000);
          pm.expect(stats.totalInvoices).to.eql(3);
          pm.expect(stats.pendingInvoices).to.eql(1);
          pm.expect(stats.overdueInvoices).to.eql(1);
      });
    language: text/javascript
order: 3000
